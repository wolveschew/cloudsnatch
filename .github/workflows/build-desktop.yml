name: Build SoundSnatch installers

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: soundsnatch-windows
          - os: macos-latest
            artifact: soundsnatch-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Build Windows executable
        if: runner.os == 'Windows'
        run: >-
          pyinstaller --noconfirm --clean --windowed --onedir
          --name SoundSnatch
          --add-data "templates;templates"
          --add-data "static;static"
          --collect-data webview
          --collect-all yt_dlp
          --hidden-import webview.platforms.edgechromium
          desktop_app.py
      - name: Smoke test packaged Windows app
        if: runner.os == 'Windows'
        run: .\dist\SoundSnatch\SoundSnatch.exe --smoke-test
      - name: Download WebView2 runtime bootstrapper
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" `
            -OutFile "dist\MicrosoftEdgeWebView2Setup.exe"
          if ((Get-Item "dist\MicrosoftEdgeWebView2Setup.exe").Length -lt 100000) {
            throw "The WebView2 runtime bootstrapper download is unexpectedly small."
          }
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) {
            throw "Inno Setup compiler was not found at $compiler"
          }
          $version = if ("${{ github.ref_type }}" -eq "tag") {
            "${{ github.ref_name }}".TrimStart("v")
          } else {
            "1.1.0"
          }
          & $compiler "/DAppVersion=$version" "installer\SoundSnatch.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup exited with code $LASTEXITCODE"
          }
      - name: Build macOS application and disk image
        if: runner.os == 'macOS'
        run: |
          pyinstaller --noconfirm --clean --windowed \
            --name SoundSnatch \
            --add-data "templates:templates" \
            --add-data "static:static" \
            --collect-data webview \
            --collect-all yt_dlp \
            --hidden-import webview.platforms.cocoa \
            --osx-bundle-identifier com.wolveschew.soundsnatch \
            desktop_app.py
          # Smoke-test the actual packaged app, including its bundled UI resources.
          dist/SoundSnatch.app/Contents/MacOS/SoundSnatch --smoke-test
          hdiutil create \
            -volname "SoundSnatch" \
            -srcfolder "dist/SoundSnatch.app" \
            -ov -format UDZO \
            "dist/SoundSnatch.dmg"
      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.os == 'Windows' && 'dist/SoundSnatchSetup.exe' || 'dist/SoundSnatch.dmg' }}
          if-no-files-found: error

  publish-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download platform installers
        uses: actions/download-artifact@v4
        with:
          pattern: soundsnatch-*
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
          fail_on_unmatched_files: true
