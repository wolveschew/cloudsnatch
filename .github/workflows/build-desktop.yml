name: Build CloudSnatch apps

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: cloudsnatch-windows
          - os: macos-latest
            artifact: cloudsnatch-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Build Windows executable
        if: runner.os == 'Windows'
        run: >-
          pyinstaller --noconfirm --clean --windowed --onedir
          --name CloudSnatch
          --add-data "templates;templates"
          --add-data "static;static"
          --collect-data webview
          --collect-all yt_dlp
          --hidden-import webview.platforms.edgechromium
          desktop_app.py
      - name: Smoke test packaged Windows app
        if: runner.os == 'Windows'
        run: .\dist\CloudSnatch\CloudSnatch.exe --smoke-test
      - name: Download WebView2 runtime bootstrapper
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" `
            -OutFile "dist\MicrosoftEdgeWebView2Setup.exe"
          if ((Get-Item "dist\MicrosoftEdgeWebView2Setup.exe").Length -lt 100000) {
            throw "The WebView2 runtime bootstrapper download is unexpectedly small."
          }
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) {
            throw "Inno Setup compiler was not found at $compiler"
          }
          $version = if ("${{ github.ref_type }}" -eq "tag") {
            "${{ github.ref_name }}".TrimStart("v")
          } else {
            "1.2.1"
          }
          & $compiler "/DAppVersion=$version" "installer\CloudSnatch.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup exited with code $LASTEXITCODE"
          }
      - name: Build macOS application and disk image
        if: runner.os == 'macOS'
        run: |
          pyinstaller --noconfirm --clean --windowed \
            --name CloudSnatch \
            --add-data "templates:templates" \
            --add-data "static:static" \
            --collect-data webview \
            --collect-all yt_dlp \
            --hidden-import webview.platforms.cocoa \
            --osx-bundle-identifier app.cloudsnatch \
            desktop_app.py
          # Smoke-test the actual packaged app, including its bundled UI resources.
          dist/CloudSnatch.app/Contents/MacOS/CloudSnatch --smoke-test
          hdiutil create \
            -volname "CloudSnatch" \
            -srcfolder "dist/CloudSnatch.app" \
            -ov -format UDZO \
            "dist/CloudSnatch.dmg"
      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.os == 'Windows' && 'dist/CloudSnatchSetup.exe' || 'dist/CloudSnatch.dmg' }}
          if-no-files-found: error

  android-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android unit tests and build debug APK
        run: |
          gradle -p android :app:testDebugUnitTest :app:assembleDebug
      - name: Run Android UI test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          script: gradle -p android :app:connectedDebugAndroidTest

  android-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Require protected Android release signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.CLOUDSNATCH_ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.CLOUDSNATCH_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CLOUDSNATCH_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.CLOUDSNATCH_ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Configure the required protected Android release secrets before creating a release tag."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/cloudsnatch-release.p12"
      - name: Build signed Android APK
        env:
          CLOUDSNATCH_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/cloudsnatch-release.p12
          CLOUDSNATCH_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.CLOUDSNATCH_ANDROID_KEYSTORE_PASSWORD }}
          CLOUDSNATCH_ANDROID_KEY_ALIAS: ${{ secrets.CLOUDSNATCH_ANDROID_KEY_ALIAS }}
          CLOUDSNATCH_ANDROID_KEY_PASSWORD: ${{ secrets.CLOUDSNATCH_ANDROID_KEY_PASSWORD }}
        run: gradle -p android :app:assembleRelease
      - name: Verify APK signature
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          apksigner="$(find "$sdk_root/build-tools" -type f -name apksigner -print -quit)"
          if [ -z "$apksigner" ]; then
            echo "::error::Android SDK build-tools apksigner was not found."
            exit 1
          fi
          "$apksigner" verify --verbose android/app/build/outputs/apk/release/app-release.apk
          cp android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/release/CloudSnatch.apk
      - name: Upload signed Android APK
        uses: actions/upload-artifact@v4
        with:
          name: cloudsnatch-android
          path: android/app/build/outputs/apk/release/CloudSnatch.apk
          if-no-files-found: error

  publish-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build, android-test, android-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download platform installers
        uses: actions/download-artifact@v4
        with:
          pattern: cloudsnatch-*
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
          fail_on_unmatched_files: true
